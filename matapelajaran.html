<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mata Pelajaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFBF2;
    --card:#FFFFFF;
    --ink:#2B2013;
    --muted:#9C8E77;
    --line:#EFE4CC;

    --marigold:#F5A623;
    --marigold-dark:#DB8F14;
    --teal:#1C8C74;
    --teal-dark:#146E5B;
    --coral:#E8552F;
    --sky:#2E8FB0;
    --lavender:#7C6FCB;
    --pink:#D6558C;

    --dot-1:#F5A623;
    --dot-2:#1C8C74;
    --dot-3:#E8552F;
    --dot-4:#2E8FB0;
    --dot-5:#7C6FCB;
    --dot-6:#D6558C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- hero ---------- */
  .hero{
    background:
      radial-gradient(circle at 14% 25%, rgba(46,143,176,0.18), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(124,111,203,0.16), transparent 45%),
      radial-gradient(circle at 70% 90%, rgba(28,140,116,0.14), transparent 45%),
      var(--paper);
    border-bottom:1px solid var(--line);
    padding:52px 24px 40px;
  }
  .hero-inner{
    max-width:900px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    font-weight:600;
    color:var(--teal-dark);
    background:#E4F3EE;
    border:1px solid #CDE9DF;
    padding:6px 14px 6px 10px;
    border-radius:100px;
    margin-bottom:16px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:44px;
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .hero p{
    margin:0;
    color:#6B5F49;
    font-size:15.5px;
    max-width:48ch;
  }
  .hero-actions{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .btn-back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--teal-dark);
    background:#fff;
    border:1.5px solid #CDE9DF;
    padding:13px 22px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .btn-back:hover{background:#E4F3EE; border-color:var(--teal); transform:translateY(-1px);}
  .btn-add{
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg, var(--sky), var(--lavender));
    border:none;
    padding:14px 26px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 8px 20px -8px rgba(124,111,203,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-add:hover{transform:translateY(-1px); box-shadow:0 10px 22px -6px rgba(124,111,203,0.6);}
  .btn-add:active{transform:translateY(0);}

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .count{
    font-size:13.5px;
    color:var(--muted);
    font-weight:500;
  }
  .count b{color:var(--teal-dark);}
  .search-wrap{position:relative;}
  .search-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--muted);
  }
  .search{
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:10px 14px 10px 36px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    color:var(--ink);
    outline:none;
    width:260px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search:focus{border-color:var(--sky); box-shadow:0 0 0 3px rgba(46,143,176,0.15);}

  /* ---------- list ---------- */
  .list{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 22px;
    border-top:1px solid var(--line);
    cursor:pointer;
    transition:background .15s ease;
  }
  .row:first-child{border-top:none;}
  .row:hover{background:#FFFBF0;}
  .row .num{
    width:30px;
    text-align:center;
    font-family:'Fraunces', serif;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    flex-shrink:0;
  }
  .row .rdot{
    width:10px;height:10px;border-radius:50%;
    background:var(--dot-1);
    flex-shrink:0;
  }
  .row .rname{
    flex:1;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
  }
  .row .rname .rsub{
    display:block;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  .row .rarrow{
    color:var(--muted);
    flex-shrink:0;
    transition:transform .15s ease, color .15s ease;
  }
  .row:hover .rarrow{transform:translateX(3px); color:var(--sky);}

  .empty-state{
    padding:64px 24px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .empty-state b{
    display:block;
    font-family:'Fraunces', serif;
    font-size:20px;
    color:var(--ink);
    font-weight:600;
    margin-bottom:6px;
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(43,32,19,0.45);
    backdrop-filter:blur(2px);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:18px;
    width:100%;
    max-width:440px;
    padding:0;
    position:relative;
    overflow:hidden;
  }
  .modal-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:26px 30px 20px;
    background:linear-gradient(135deg, #E9F3FA, #EFEBFB);
    border-bottom:1px solid var(--line);
  }
  .modal-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .modal-head p{
    margin:0;
    font-size:13.5px;
    color:#7A6C52;
  }
  .modal-close{
    background:#fff;
    border:1px solid var(--line);
    width:32px;height:32px;
    border-radius:50%;
    font-size:18px;
    line-height:1;
    color:var(--muted);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .modal-close:hover{color:var(--coral); border-color:var(--coral);}

  .modal-body{padding:26px 30px 28px;}

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:6px;
  }
  label{font-size:13px; font-weight:600; color:var(--ink);}
  input[type=text],select{
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#FFFDF8;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
    width:100%;
  }
  select{cursor:pointer; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B5F49' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; padding-right:34px;
  }
  input[readonly]{background:#F1EEE3; color:#6B5F49; cursor:not-allowed;}
  input:focus,select:focus{
    border-color:var(--sky);
    box-shadow:0 0 0 3px rgba(46,143,176,0.15);
    background:#fff;
  }

  .modal-actions{
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:14px;
  }
  button.submit{
    font-family:'Inter', sans-serif;
    font-size:14.5px; font-weight:700; color:#fff;
    background:linear-gradient(135deg, var(--sky), var(--lavender));
    border:none;
    padding:12px 24px; border-radius:10px; cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(124,111,203,0.5);
    transition:transform .15s ease;
  }
  button.submit:hover{transform:translateY(-1px);}
  button.submit:disabled{background:var(--muted); box-shadow:none; cursor:not-allowed; transform:none;}

  .btn-cancel{
    font-family:'Inter', sans-serif;
    font-size:14.5px; font-weight:600; color:#6B5F49;
    background:#fff; border:1.5px solid var(--line);
    padding:11px 20px; border-radius:10px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn-cancel:hover{border-color:#D8C9A0; color:var(--ink);}

  .btn-delete{
    font-family:'Inter', sans-serif;
    font-size:14px; font-weight:600; color:var(--coral);
    background:#FDECE6; border:1.5px solid #F7CFC0;
    padding:10px 16px; border-radius:10px; cursor:pointer;
    transition:background .15s ease;
  }
  .btn-delete:hover{background:#FADED1;}
  .btn-delete:disabled{opacity:.6; cursor:not-allowed;}

  .status{font-size:13px; flex:1; font-weight:500;}
  .status.ok{color:var(--teal-dark);}
  .status.err{color:var(--coral);}

  @media (max-width:640px){
    .hero{padding:40px 20px 32px;}
    .hero h1{font-size:32px;}
    .hero-actions{width:100%;}
    .hero-actions .btn-add, .hero-actions .btn-back{flex:1; justify-content:center;}
    .toolbar{flex-direction:column; align-items:stretch;}
    .search{width:100%;}
    .modal-head, .modal-body{padding-left:22px; padding-right:22px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div>
      <span class="eyebrow"><span class="dot"></span>Sistem data sekolah</span>
      <h1>Mata Pelajaran</h1>
      <p>Kelola daftar mata pelajaran yang tersedia di sekolah.</p>
    </div>
    <div class="hero-actions">
      <a class="btn-back" href="admin.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <button class="btn-add" id="btnOpenModal">+ Tambah mapel</button>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="toolbar">
    <span class="count" id="countLabel">Memuat data...</span>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" class="search" id="searchInput" placeholder="Cari mata pelajaran...">
    </div>
  </div>

  <div class="list" id="listWrap">
    <div id="listBody"></div>
  </div>

</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modalTitle">Tambah mapel</h2>
        <p id="modalDesc">Masukkan nama mata pelajaran baru.</p>
      </div>
      <button class="modal-close" id="btnCloseModal" type="button">&times;</button>
    </div>

    <div class="modal-body">
      <form id="formMapel" autocomplete="off">
        <div class="field">
          <label for="nama_mapel">Nama mata pelajaran</label>
          <input type="text" id="nama_mapel" name="nama_mapel" required placeholder="cth. Matematika">
        </div>

        <div class="field">
          <label for="guru_pengajar">Guru pengajar</label>
          <select id="guru_pengajar" name="guru_pengajar" required>
            <option value="" disabled selected>Pilih guru pengajar</option>
          </select>
        </div>

        <div class="field">
          <label for="nip">NIP / NIY</label>
          <input type="text" id="nip" name="nip" readonly placeholder="Terisi otomatis setelah memilih guru">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-delete" id="btnDelete" style="display:none;">Hapus</button>
          <span class="status" id="statusMsg"></span>
          <button type="button" class="btn-cancel" id="btnCancel">Batal</button>
          <button type="submit" class="submit" id="btnSubmit">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://obyeehxaencjphzejrmc.supabase.co";
  const SUPABASE_REST = SUPABASE_URL + "/rest/v1/";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ieWVlaHhhZW5janBoemVqcm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTY1MTEsImV4cCI6MjEwNTUzMjUxMX0.Dt-l_xY-nZw9eDtttwNXn0joMjE9O-hrFWvO2i-ogkw";
  const TABLE = "datamapel";
  const DOT_COLORS = ["var(--dot-1)","var(--dot-2)","var(--dot-3)","var(--dot-4)","var(--dot-5)","var(--dot-6)"];

  const overlay = document.getElementById("overlay");
  const btnOpenModal = document.getElementById("btnOpenModal");
  const btnCloseModal = document.getElementById("btnCloseModal");
  const btnCancel = document.getElementById("btnCancel");
  const btnDelete = document.getElementById("btnDelete");
  const form = document.getElementById("formMapel");
  const btnSubmit = document.getElementById("btnSubmit");
  const statusMsg = document.getElementById("statusMsg");
  const namaInput = document.getElementById("nama_mapel");
  const guruSelect = document.getElementById("guru_pengajar");
  const nipInput = document.getElementById("nip");
  const listBody = document.getElementById("listBody");
  const countLabel = document.getElementById("countLabel");
  const searchInput = document.getElementById("searchInput");
  const modalTitle = document.getElementById("modalTitle");
  const modalDesc = document.getElementById("modalDesc");

  let allMapel = [];
  let allGuru = [];
  let editingMapel = null; // null = mode tambah, object = mode edit

  /* ---------- guru pengajar (tabel dataguru) ---------- */
  async function loadGuruOptions() {
    try {
      const res = await fetch(SUPABASE_REST + "dataguru?select=nama_guru,nip&order=nama_guru.asc", {
        headers: {
          "apikey": ANON_KEY,
          "Authorization": "Bearer " + ANON_KEY
        }
      });
      if (!res.ok) throw new Error(await res.text());
      allGuru = await res.json();

      guruSelect.innerHTML = `<option value="" disabled>Pilih guru pengajar</option>` +
        allGuru.map(g => `<option value="${escapeHtml(g.nama_guru || "")}">${escapeHtml(g.nama_guru || "-")}</option>`).join("");
    } catch (err) {
      console.error(err);
      guruSelect.innerHTML = `<option value="" disabled selected>Gagal memuat data guru</option>`;
    }
  }

  // Saat guru dipilih, isi NIP otomatis sesuai data dari tabel dataguru.
  guruSelect.addEventListener("change", () => {
    const guru = allGuru.find(g => g.nama_guru === guruSelect.value);
    nipInput.value = guru ? (guru.nip || "") : "";
  });

  /* ---------- modal open/close ---------- */
  function openModal() {
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    setTimeout(() => namaInput.focus(), 50);
  }
  function closeModal() {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    form.reset();
    editingMapel = null;
    setStatus("", "");
  }

  function openAddModal() {
    editingMapel = null;
    modalTitle.textContent = "Tambah mapel";
    modalDesc.textContent = "Masukkan nama mata pelajaran baru.";
    btnSubmit.textContent = "Simpan";
    btnDelete.style.display = "none";
    namaInput.value = "";
    guruSelect.value = "";
    nipInput.value = "";
    openModal();
  }

  function openEditModal(mapel) {
    editingMapel = mapel;
    modalTitle.textContent = "Edit mapel";
    modalDesc.textContent = "Perbarui nama mata pelajaran, atau hapus.";
    btnSubmit.textContent = "Simpan perubahan";
    btnDelete.style.display = "inline-block";
    namaInput.value = mapel.nama_mapel || "";
    guruSelect.value = mapel.guru_pengajar || "";
    nipInput.value = mapel.nip || "";
    openModal();
  }

  btnOpenModal.addEventListener("click", openAddModal);
  btnCloseModal.addEventListener("click", closeModal);
  btnCancel.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  });

  btnDelete.addEventListener("click", async () => {
    if (!editingMapel) return;
    const ok = confirm(`Hapus mata pelajaran "${editingMapel.nama_mapel}"? Tindakan ini tidak dapat dibatalkan.`);
    if (!ok) return;

    btnDelete.disabled = true;
    btnDelete.textContent = "Menghapus...";
    try {
      await deleteMapel(editingMapel.id);
      allMapel = allMapel.filter(m => m.id !== editingMapel.id);
      renderList();
      closeModal();
    } catch (err) {
      console.error(err);
      setStatus(err.message || "Gagal menghapus data.", "err");
    } finally {
      btnDelete.disabled = false;
      btnDelete.textContent = "Hapus";
    }
  });

  function setStatus(text, type) {
    statusMsg.textContent = text;
    statusMsg.className = "status" + (type ? " " + type : "");
  }

  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  async function insertMapel(data) {
    const res = await fetch(SUPABASE_REST + TABLE, {
      method: "POST",
      headers: {
        "apikey": ANON_KEY,
        "Authorization": "Bearer " + ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error("Gagal menyimpan data: " + (await res.text()));
    return res.json();
  }

  async function updateMapel(id, data) {
    const res = await fetch(SUPABASE_REST + TABLE + "?id=eq." + encodeURIComponent(id), {
      method: "PATCH",
      headers: {
        "apikey": ANON_KEY,
        "Authorization": "Bearer " + ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error("Gagal memperbarui data: " + (await res.text()));
    return res.json();
  }

  async function deleteMapel(id) {
    const res = await fetch(SUPABASE_REST + TABLE + "?id=eq." + encodeURIComponent(id), {
      method: "DELETE",
      headers: {
        "apikey": ANON_KEY,
        "Authorization": "Bearer " + ANON_KEY
      }
    });
    if (!res.ok) throw new Error("Gagal menghapus data: " + (await res.text()));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setStatus("", "");
    btnSubmit.disabled = true;
    const originalLabel = btnSubmit.textContent;
    const isEdit = !!editingMapel;

    try {
      const payload = {
        nama_mapel: namaInput.value.trim(),
        guru_pengajar: guruSelect.value.trim(),
        nip: nipInput.value.trim() || null
      };

      if (!isEdit) {
        payload.id = genId();
        const inserted = await insertMapel(payload);
        if (Array.isArray(inserted) && inserted.length) {
          allMapel.unshift(inserted[0]);
        } else {
          allMapel.unshift(payload);
        }
      } else {
        const updated = await updateMapel(editingMapel.id, payload);
        const newData = (Array.isArray(updated) && updated.length) ? updated[0] : { ...editingMapel, ...payload };
        const idx = allMapel.findIndex(m => m.id === editingMapel.id);
        if (idx !== -1) allMapel[idx] = newData;
      }

      renderList();
      setStatus(isEdit ? "Perubahan berhasil disimpan." : "Mata pelajaran berhasil ditambahkan.", "ok");
      setTimeout(closeModal, 600);

    } catch (err) {
      console.error(err);
      setStatus(err.message || "Terjadi kesalahan, coba lagi.", "err");
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = originalLabel;
    }
  });

  /* ---------- list rendering ---------- */
  function colorFor(str) {
    let hash = 0;
    for (let i = 0; i < (str || "").length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return DOT_COLORS[hash % DOT_COLORS.length];
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[s]));
  }

  function renderList() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q
      ? allMapel.filter(m => (m.nama_mapel || "").toLowerCase().includes(q) || (m.guru_pengajar || "").toLowerCase().includes(q))
      : allMapel;

    countLabel.innerHTML = allMapel.length === 0
      ? "Belum ada data mapel"
      : `<b>${filtered.length}</b> dari ${allMapel.length} mata pelajaran`;

    if (allMapel.length === 0) {
      listBody.innerHTML = `<div class="empty-state"><b>Belum ada data</b>Tambahkan mata pelajaran pertama lewat tombol "Tambah mapel".</div>`;
      return;
    }
    if (filtered.length === 0) {
      listBody.innerHTML = `<div class="empty-state">Tidak ada mata pelajaran yang cocok dengan pencarian.</div>`;
      return;
    }

    listBody.innerHTML = filtered.map((m, i) => `
      <div class="row" data-id="${escapeHtml(m.id)}">
        <span class="num">${i + 1}</span>
        <span class="rdot" style="background:${colorFor(m.nama_mapel || m.id || '')}"></span>
        <span class="rname">${escapeHtml(m.nama_mapel || "-")}${m.guru_pengajar ? `<span class="rsub">${escapeHtml(m.guru_pengajar)}${m.nip ? " · NIP " + escapeHtml(m.nip) : ""}</span>` : ""}</span>
        <svg class="rarrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `).join("");

    listBody.querySelectorAll(".row").forEach(row => {
      row.addEventListener("click", () => {
        const id = row.getAttribute("data-id");
        const mapel = allMapel.find(m => String(m.id) === id);
        if (mapel) openEditModal(mapel);
      });
    });
  }

  searchInput.addEventListener("input", renderList);

  async function loadMapel() {
    try {
      const res = await fetch(SUPABASE_REST + TABLE + "?select=*&order=nama_mapel.asc", {
        headers: {
          "apikey": ANON_KEY,
          "Authorization": "Bearer " + ANON_KEY
        }
      });
      if (!res.ok) throw new Error(await res.text());
      allMapel = await res.json();
      renderList();
    } catch (err) {
      console.error(err);
      countLabel.textContent = "Gagal memuat data mata pelajaran";
      listBody.innerHTML = `<div class="empty-state">Tidak dapat memuat data. Periksa koneksi atau pengaturan Supabase.</div>`;
    }
  }

  loadMapel();
  loadGuruOptions();
</script>
