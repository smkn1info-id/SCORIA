<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa — SCORIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
  :root{
    --ink:#3B2E63;
    --ink-soft:#7A7191;
    --paper:#FFFAF0;
    --paper-deep:#FFEFD6;
    --paper-line:#F5DDAE;
    --brand:#6C4FE0;
    --gold:#FFC93C;
    --brick:#D6336C;
    --green:#1A8754;
    --turquoise:#0F766E;
    --purple:#7B5EEA;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- Navbar ---------- */
  .navbar{
    position:sticky; top:0; z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--brand);
    color:#FFFFFF;
    padding:14px clamp(16px,4vw,40px);
  }
  .navbar-title{
    font-family:'JetBrains Mono',monospace;
    font-size:0.82rem;
    letter-spacing:0.02em;
    color:rgba(255,255,255,0.75);
  }

  /* ---------- Main ---------- */
  main{
    max-width:960px;
    margin:0 auto;
    padding:32px clamp(16px,4vw,40px) 60px;
  }
  .page-heading{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:clamp(1.4rem,2.6vw,1.85rem);
    margin:0 0 4px;
  }
  .page-sub{
    font-size:0.92rem;
    color:var(--ink-soft);
    margin:0 0 28px;
  }

  .card{
    background:#fffdf7;
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:24px clamp(18px,3vw,28px);
    margin-bottom:24px;
  }
  .card h2{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:1.15rem;
    margin:0 0 18px;
  }

  form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 18px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{
    font-size:0.82rem;
    font-weight:500;
    color:var(--ink-soft);
  }
  .label-hint{
    font-weight:400;
    color:var(--ink-soft);
    opacity:0.75;
    font-size:0.78rem;
  }
  input, select, textarea{
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:5px;
    background:#fbf8f0;
    color:var(--ink);
    width:100%;
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, select:focus, textarea:focus{border-color:var(--brick);}
  input:disabled{background:var(--paper-deep); color:var(--ink-soft); cursor:not-allowed;}
  select{appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237A7191' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    padding-right:32px;
  }

  .id-row{display:flex; gap:8px;}
  .id-row input{flex:1;}
  .btn-regen{padding:10px 14px; font-size:0.8rem; white-space:nowrap; flex-shrink:0;}

  .form-actions{
    grid-column:1 / -1;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:4px;
  }
  .form-buttons{display:flex; gap:12px;}
  .form-buttons > *{flex:1; text-align:center; justify-content:center;}

  .btn-primary{
    background:var(--gold);
    color:#2E2308;
    border:none;
    border-radius:5px;
    padding:11px 24px;
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .btn-primary:hover{background:#F0B62E;}
  .btn-primary:disabled{background:#e8dfc4; color:#9a916f; cursor:not-allowed;}
  .btn-ghost{
    background:none;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    border-radius:5px;
    padding:10px 18px;
    font-size:0.88rem;
    font-weight:500;
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .btn-ghost:hover{border-color:var(--ink); color:var(--ink);}
  .btn-ghost.btn-export:hover{border-color:var(--turquoise); color:var(--turquoise);}
  .btn-ghost.btn-import:hover{border-color:var(--purple); color:var(--purple);}
  a.btn-ghost{display:inline-flex; align-items:center; gap:6px; text-decoration:none;}
  .btn-ghost{display:inline-flex; align-items:center; gap:6px; justify-content:center;}
  .form-msg{font-size:0.85rem;}
  .form-msg.ok{color:var(--green);}
  .form-msg.err{color:var(--brick);}

  /* ---------- Table ---------- */
  .table-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px 18px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .table-header h2{margin:0;}
  .table-controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-left:auto;
  }
  .kelas-filter{
    width:auto;
    min-width:150px;
    padding:8px 30px 8px 12px;
    font-size:0.85rem;
  }
  .btn-ghost.btn-export-pdf{padding:8px 14px; font-size:0.82rem;}
  .btn-ghost.btn-export-pdf:hover{border-color:var(--brick); color:var(--brick);}
  .table-count{
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .table-wrap{overflow-x:auto;}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:0.9rem;
  }
  thead th{
    text-align:left;
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    font-weight:700;
    padding:0 10px 10px;
    border-bottom:1px solid var(--paper-line);
    white-space:nowrap;
  }
  tbody td{
    padding:12px 10px;
    border-bottom:1px solid var(--paper-line);
    vertical-align:middle;
    white-space:nowrap;
  }
  tbody tr:last-child td{border-bottom:none;}
  td.id-col{
    font-family:'JetBrains Mono',monospace;
    font-size:0.82rem;
    color:var(--brick);
  }
  td.wrap-col{white-space:normal; max-width:220px;}
  .kelas-badge{
    display:inline-block;
    background:var(--paper-deep);
    border:1px solid var(--paper-line);
    color:var(--ink);
    border-radius:999px;
    padding:3px 10px;
    font-size:0.78rem;
    font-weight:500;
  }
  .row-actions{display:flex; gap:8px; justify-content:flex-end;}
  .icon-btn{
    background:none;
    border:1px solid var(--paper-line);
    border-radius:5px;
    padding:6px 10px;
    font-size:0.8rem;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    transition:border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .icon-btn.edit:hover{border-color:var(--purple); color:var(--purple);}
  .icon-btn.delete:hover{border-color:var(--brick); color:var(--brick); background:#FFE3EE;}

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:30px 0;
  }

  /* ---------- Flatpickr theme tweaks ---------- */
  .flatpickr-calendar{
    font-family:'Inter',sans-serif;
    border-radius:8px;
    box-shadow:0 12px 28px rgba(59,46,99,0.18);
  }
  .flatpickr-day.selected, .flatpickr-day.selected:hover{
    background:var(--brick);
    border-color:var(--brick);
  }
  .flatpickr-day.today{border-color:var(--gold);}
  .flatpickr-months .flatpickr-month, .flatpickr-current-month .flatpickr-monthDropdown-months{
    color:var(--ink);
  }
  .flatpickr-months .flatpickr-prev-month, .flatpickr-months .flatpickr-next-month{color:var(--ink-soft);}

  @media (max-width:560px){
    form{grid-template-columns:1fr;}
    .row-actions{flex-direction:column; align-items:flex-end;}
    .form-buttons{flex-wrap:wrap;}
    .form-buttons > *{flex:1 1 45%;}
  }
</style>
</head>
<body>

<header class="navbar">
  <span class="navbar-title">DATA SISWA</span>
</header>

<main>
  <h1 class="page-heading">Data Siswa</h1>
  <p class="page-sub">Tambah, ubah, atau hapus data siswa yang terdaftar di SCORIA.</p>

  <div class="card">
    <h2 id="formHeading">Tambah Siswa Baru</h2>
    <form id="siswaForm">
      <div class="field">
        <label for="siswaId">ID <span class="label-hint">(otomatis)</span></label>
        <div class="id-row">
          <input type="text" id="siswaId" required autocomplete="off" disabled>
          <button type="button" class="btn-ghost btn-regen" id="btnRegenId">Acak Ulang</button>
        </div>
      </div>

      <div class="field">
        <label for="namaSiswa">Nama Siswa</label>
        <input type="text" id="namaSiswa" required autocomplete="off">
      </div>

      <div class="field">
        <label for="nisn">NISN</label>
        <input type="text" id="nisn" required autocomplete="off">
      </div>

      <div class="field">
        <label for="kelas">Kelas</label>
        <select id="kelas" required>
          <option value="">Memuat data kelas...</option>
        </select>
      </div>

      <div class="field">
        <label for="tempatLahir">Tempat Lahir</label>
        <input type="text" id="tempatLahir" required autocomplete="off">
      </div>

      <div class="field">
        <label for="tanggalLahir">Tanggal Lahir</label>
        <input type="text" id="tanggalLahir" placeholder="Pilih tanggal" required autocomplete="off">
      </div>

      <div class="field full">
        <label for="alamat">Alamat</label>
        <textarea id="alamat"></textarea>
      </div>

      <div class="form-actions">
        <div class="form-buttons">
          <button type="submit" class="btn-primary" id="btnSubmit">Simpan</button>
          <button type="button" class="btn-ghost btn-export" id="btnExportTemplate">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
            Export Template (Excel)
          </button>
          <button type="button" class="btn-ghost btn-import" id="btnImportData">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg>
            Import Data (Excel)
          </button>
          <input type="file" id="importFileInput" accept=".xlsx,.xls" hidden>
          <a href="admin.html" class="btn-ghost">Dashboard</a>
          <button type="button" class="btn-ghost" id="btnCancelEdit" hidden>Batal Ubah</button>
        </div>
        <span class="form-msg" id="formMsg"></span>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="table-header">
      <h2>Daftar Siswa</h2>
      <div class="table-controls">
        <select id="kelasFilter" class="kelas-filter">
          <option value="">Semua Kelas</option>
        </select>
        <button type="button" class="btn-ghost btn-export-pdf" id="btnExportPdf">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
          Export PDF
        </button>
        <span class="table-count" id="tableCount">0 siswa</span>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Siswa</th>
            <th>NISN</th>
            <th>Kelas</th>
            <th>Tempat, Tgl Lahir</th>
            <th>Alamat</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="siswaBody"></tbody>
      </table>
    </div>
    <p class="empty-state" id="emptyState" hidden>Belum ada data siswa. Tambahkan lewat formulir di atas.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/id.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
  const SUPABASE_URL = "https://obyeehxaencjphzejrmc.supabase.co/rest/v1";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ieWVlaHhhZW5janBoemVqcm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTY1MTEsImV4cCI6MjEwNTUzMjUxMX0.Dt-l_xY-nZw9eDtttwNXn0joMjE9O-hrFWvO2i-ogkw";
  const TABLE = "datasiswa";
  const ROMBEL_TABLE = "rombel";

  const headersBase = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY
  };

  const form = document.getElementById('siswaForm');
  const siswaIdInput = document.getElementById('siswaId');
  const namaSiswaInput = document.getElementById('namaSiswa');
  const nisnInput = document.getElementById('nisn');
  const kelasSelect = document.getElementById('kelas');
  const tempatLahirInput = document.getElementById('tempatLahir');
  const tanggalLahirInput = document.getElementById('tanggalLahir');
  const alamatInput = document.getElementById('alamat');

  const formHeading = document.getElementById('formHeading');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancelEdit = document.getElementById('btnCancelEdit');
  const btnRegenId = document.getElementById('btnRegenId');
  const btnExportTemplate = document.getElementById('btnExportTemplate');
  const btnImportData = document.getElementById('btnImportData');
  const importFileInput = document.getElementById('importFileInput');
  const formMsg = document.getElementById('formMsg');
  const siswaBody = document.getElementById('siswaBody');
  const emptyState = document.getElementById('emptyState');
  const tableCount = document.getElementById('tableCount');
  const kelasFilter = document.getElementById('kelasFilter');
  const btnExportPdf = document.getElementById('btnExportPdf');

  let editingId = null;
  let allSiswaRows = [];

  const datePicker = flatpickr(tanggalLahirInput, {
    dateFormat: "Y-m-d",
    altInput: true,
    altFormat: "j F Y",
    locale: "id",
    maxDate: "today",
    allowInput: false
  });

  function setFormMsg(text, type){
    formMsg.textContent = text || '';
    formMsg.className = 'form-msg' + (type ? ' ' + type : '');
  }

  function generateSiswaId(){
    const num = Math.floor(10000 + Math.random() * 90000);
    return 'id-' + num;
  }

  function generateUniqueId(usedSet){
    let id = generateSiswaId();
    while(usedSet.has(id)){
      id = generateSiswaId();
    }
    usedSet.add(id);
    return id;
  }

  const IMPORT_HEADERS = ['Nama Siswa', 'NISN', 'Kelas', 'Tempat Lahir', 'Tanggal Lahir (YYYY-MM-DD)', 'Alamat'];

  function enterAddMode(){
    editingId = null;
    formHeading.textContent = 'Tambah Siswa Baru';
    btnSubmit.textContent = 'Simpan';
    btnCancelEdit.hidden = true;
    btnRegenId.hidden = false;
    form.reset();
    siswaIdInput.value = generateSiswaId();
    siswaIdInput.disabled = true;
    datePicker.clear();
    setFormMsg('', '');
  }

  function enterEditMode(row){
    editingId = row.id;
    formHeading.textContent = 'Ubah Data Siswa';
    btnSubmit.textContent = 'Simpan Perubahan';
    btnCancelEdit.hidden = false;
    btnRegenId.hidden = true;
    siswaIdInput.value = row.id;
    siswaIdInput.disabled = true;
    namaSiswaInput.value = row.nama_siswa ?? '';
    nisnInput.value = row.nisn ?? '';
    kelasSelect.value = row.kelas ?? '';
    tempatLahirInput.value = row.tempat_lahir ?? '';
    datePicker.setDate(row.tanggal_lahir || null, true);
    alamatInput.value = row.alamat ?? '';
    setFormMsg('', '');
    namaSiswaInput.focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  btnRegenId.addEventListener('click', () => {
    siswaIdInput.value = generateSiswaId();
  });

  btnCancelEdit.addEventListener('click', () => {
    enterAddMode();
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function formatTanggal(iso){
    if(!iso) return '-';
    try{
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
    }catch(e){ return iso; }
  }

  async function loadKelasOptions(selectedValue){
    try{
      const res = await fetch(`${SUPABASE_URL}/${ROMBEL_TABLE}?select=nama_rombel&order=nama_rombel.asc`, {
        headers: headersBase
      });
      if(!res.ok) throw new Error('Status ' + res.status);
      const rows = await res.json();

      kelasSelect.innerHTML = '<option value="">Pilih kelas</option>';
      rows.forEach(r => {
        if(!r.nama_rombel) return;
        const opt = document.createElement('option');
        opt.value = r.nama_rombel;
        opt.textContent = r.nama_rombel;
        kelasSelect.appendChild(opt);
      });

      if(rows.length === 0){
        kelasSelect.innerHTML = '<option value="">Belum ada data rombel</option>';
      }
      if(selectedValue) kelasSelect.value = selectedValue;
    }catch(err){
      console.error('Gagal memuat daftar kelas:', err);
      kelasSelect.innerHTML = '<option value="">Gagal memuat kelas</option>';
    }
  }

  function renderRows(rows){
    siswaBody.innerHTML = '';
    tableCount.textContent = rows.length + ' siswa';

    if(rows.length === 0){
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;

    rows.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="id-col">${escapeHtml(row.id)}</td>
        <td>${escapeHtml(row.nama_siswa)}</td>
        <td>${escapeHtml(row.nisn)}</td>
        <td><span class="kelas-badge">${escapeHtml(row.kelas)}</span></td>
        <td class="wrap-col">${escapeHtml(row.tempat_lahir)}, ${formatTanggal(row.tanggal_lahir)}</td>
        <td class="wrap-col">${escapeHtml(row.alamat)}</td>
        <td>
          <div class="row-actions">
            <button type="button" class="icon-btn edit">Ubah</button>
            <button type="button" class="icon-btn delete">Hapus</button>
          </div>
        </td>
      `;
      tr.querySelector('.edit').addEventListener('click', () => enterEditMode(row));
      tr.querySelector('.delete').addEventListener('click', () => deleteSiswa(row));
      siswaBody.appendChild(tr);
    });
  }

  async function loadSiswa(){
    try{
      const res = await fetch(`${SUPABASE_URL}/${TABLE}?select=*&order=nama_siswa.asc`, {
        headers: headersBase
      });
      if(!res.ok) throw new Error('Status ' + res.status);
      const rows = await res.json();
      allSiswaRows = rows;
      populateKelasFilter(rows);
      applyKelasFilter();
    }catch(err){
      console.error(err);
      setFormMsg('Gagal memuat daftar siswa: ' + err.message, 'err');
    }
  }

  function populateKelasFilter(rows){
    const current = kelasFilter.value;
    const kelasList = Array.from(new Set(rows.map(r => r.kelas).filter(Boolean))).sort();
    kelasFilter.innerHTML = '<option value="">Semua Kelas</option>' +
      kelasList.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
    if(current && kelasList.includes(current)) kelasFilter.value = current;
  }

  function applyKelasFilter(){
    const val = kelasFilter.value;
    const filtered = val ? allSiswaRows.filter(r => r.kelas === val) : allSiswaRows;
    renderRows(filtered);
  }

  kelasFilter.addEventListener('change', applyKelasFilter);

  async function deleteSiswa(row){
    const ok = confirm(`Hapus data siswa "${row.nama_siswa}" (${row.id})? Tindakan ini tidak bisa dibatalkan.`);
    if(!ok) return;

    try{
      const res = await fetch(`${SUPABASE_URL}/${TABLE}?id=eq.${encodeURIComponent(row.id)}`, {
        method: 'DELETE',
        headers: headersBase
      });
      if(!res.ok) throw new Error('Status ' + res.status);

      if(editingId === row.id) enterAddMode();
      await loadSiswa();
    }catch(err){
      console.error(err);
      alert('Gagal menghapus data: ' + err.message);
    }
  }

  function exportTemplate(){
    const headers = IMPORT_HEADERS;
    const example = [
      'Contoh: Ayu Lestari',
      '0051234567',
      kelasSelect.options.length > 1 ? kelasSelect.options[1].value : 'VII A',
      'Jakarta',
      '2012-05-14',
      'Jl. Melati No. 10, Jakarta'
    ];
    const wsData = [headers, example];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:24},{wch:14},{wch:12},{wch:16},{wch:24},{wch:32}];

    const kelasList = Array.from(kelasSelect.options).map(o => o.value).filter(Boolean);
    const panduanRows = [
      ['Petunjuk pengisian template Data Siswa'],
      [''],
      ['1. Jangan mengubah nama kolom pada baris pertama sheet "Data Siswa".'],
      ['2. Timpa atau hapus baris contoh sebelum mengisi data yang sebenarnya.'],
      ['3. Format Tanggal Lahir: YYYY-MM-DD, contoh 2012-05-14.'],
      ['4. Kolom Kelas harus sama persis dengan salah satu nama kelas berikut:'],
      ...(kelasList.length ? kelasList.map(k => ['     - ' + k]) : [['     (belum ada data kelas / rombel)']]),
      [''],
      ['5. Kolom ID tidak perlu diisi, akan dibuat otomatis saat data diimpor.']
    ];
    const wsPanduan = XLSX.utils.aoa_to_sheet(panduanRows);
    wsPanduan['!cols'] = [{wch:60}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data Siswa');
    XLSX.utils.book_append_sheet(wb, wsPanduan, 'Panduan');
    XLSX.writeFile(wb, 'template_data_siswa.xlsx');
  }

  function excelDateToIso(value){
    if(value instanceof Date && !isNaN(value)){
      const y = value.getFullYear();
      const m = String(value.getMonth() + 1).padStart(2, '0');
      const d = String(value.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    if(typeof value === 'number'){
      const parsed = XLSX.SSF.parse_date_code(value);
      if(parsed) return `${parsed.y}-${String(parsed.m).padStart(2,'0')}-${String(parsed.d).padStart(2,'0')}`;
    }
    if(typeof value === 'string' && value.trim()){
      const s = value.trim();
      if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const parsed = new Date(s);
      if(!isNaN(parsed)) return excelDateToIso(parsed);
    }
    return '';
  }

  async function handleImportFile(file){
    const usedIds = new Set();
    const arrayBuffer = await file.arrayBuffer();
    const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
    const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('data')) || wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    if(!ws) throw new Error('Sheet data tidak ditemukan di file tersebut.');

    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    if(rows.length === 0) throw new Error('Tidak ada baris data pada file yang dipilih.');

    const payloads = [];
    const skipped = [];

    rows.forEach((r, idx) => {
      const nama_siswa = String(r['Nama Siswa'] ?? '').trim();
      const nisn = String(r['NISN'] ?? '').trim();
      const kelas = String(r['Kelas'] ?? '').trim();
      const tempat_lahir = String(r['Tempat Lahir'] ?? '').trim();
      const tanggal_lahir = excelDateToIso(r['Tanggal Lahir (YYYY-MM-DD)']);
      const alamat = String(r['Alamat'] ?? '').trim();

      const isEmptyRow = !nama_siswa && !nisn && !kelas && !tempat_lahir && !tanggal_lahir && !alamat;
      if(isEmptyRow) return;
      if(nama_siswa.toLowerCase().startsWith('contoh:')) return;

      if(!nama_siswa || !nisn || !kelas || !tempat_lahir || !tanggal_lahir){
        skipped.push(idx + 2);
        return;
      }

      payloads.push({
        id: generateUniqueId(usedIds),
        nama_siswa, nisn, kelas, tempat_lahir, tanggal_lahir, alamat
      });
    });

    if(payloads.length === 0){
      throw new Error('Tidak ada baris valid untuk diimpor.' + (skipped.length ? ' Periksa kolom wajib pada baris: ' + skipped.join(', ') + '.' : ''));
    }

    const res = await fetch(`${SUPABASE_URL}/${TABLE}`, {
      method: 'POST',
      headers: { ...headersBase, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify(payloads)
    });
    if(!res.ok){
      const errBody = await res.text();
      throw new Error(errBody || ('Status ' + res.status));
    }

    return { imported: payloads.length, skipped };
  }

  function exportPdf(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    const val = kelasFilter.value;
    const rows = val ? allSiswaRows.filter(r => r.kelas === val) : allSiswaRows;

    doc.setFontSize(14);
    doc.text('Daftar Siswa' + (val ? ' — Kelas ' + val : ''), 14, 15);
    doc.setFontSize(9);
    doc.setTextColor(120, 113, 145);
    doc.text('Diunduh: ' + new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) + ' · Total: ' + rows.length + ' siswa', 14, 21);

    const body = rows.map(r => [
      r.id || '',
      r.nama_siswa || '',
      r.nisn || '',
      r.kelas || '',
      `${r.tempat_lahir || ''}, ${formatTanggal(r.tanggal_lahir)}`,
      r.alamat || ''
    ]);

    const autoTableOptions = {
      startY: 26,
      head: [['ID', 'Nama Siswa', 'NISN', 'Kelas', 'Tempat, Tgl Lahir', 'Alamat']],
      body,
      styles: { fontSize: 8, cellPadding: 3, textColor: [59, 46, 99] },
      headStyles: { fillColor: [108, 79, 224], textColor: 255 },
      alternateRowStyles: { fillColor: [255, 239, 214] }
    };

    if(typeof doc.autoTable === 'function'){
      doc.autoTable(autoTableOptions);
    } else if(window['jspdf-autotable'] && typeof window['jspdf-autotable'].autoTable === 'function'){
      window['jspdf-autotable'].autoTable(doc, autoTableOptions);
    } else {
      throw new Error('Library AutoTable belum termuat.');
    }

    const fileSuffix = val ? '_' + val.replace(/\s+/g, '_') : '';
    doc.save(`daftar_siswa${fileSuffix}.pdf`);
  }

  btnExportPdf.addEventListener('click', () => {
    if(allSiswaRows.length === 0){
      setFormMsg('Tidak ada data siswa untuk diekspor.', 'err');
      return;
    }
    try{
      exportPdf();
      setFormMsg('PDF daftar siswa berhasil diunduh.', 'ok');
    }catch(err){
      console.error(err);
      setFormMsg('Gagal membuat PDF: ' + err.message, 'err');
    }
  });

  btnExportTemplate.addEventListener('click', () => {
    try{
      exportTemplate();
      setFormMsg('Template Excel berhasil diunduh.', 'ok');
    }catch(err){
      console.error(err);
      setFormMsg('Gagal membuat template: ' + err.message, 'err');
    }
  });

  btnImportData.addEventListener('click', () => {
    importFileInput.click();
  });

  importFileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;

    const originalLabel = btnImportData.innerHTML;
    btnImportData.disabled = true;
    btnImportData.textContent = 'Mengimpor...';
    setFormMsg('', '');

    try{
      const result = await handleImportFile(file);
      let msg = `${result.imported} data siswa berhasil diimpor dari Excel.`;
      if(result.skipped.length){
        msg += ` ${result.skipped.length} baris dilewati karena belum lengkap (baris: ${result.skipped.join(', ')}).`;
      }
      setFormMsg(msg, 'ok');
      await loadSiswa();
    }catch(err){
      console.error(err);
      setFormMsg('Gagal mengimpor data: ' + err.message, 'err');
    }finally{
      btnImportData.disabled = false;
      btnImportData.innerHTML = originalLabel;
      importFileInput.value = '';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setFormMsg('', '');

    const id = siswaIdInput.value.trim();
    const nama_siswa = namaSiswaInput.value.trim();
    const nisn = nisnInput.value.trim();
    const kelas = kelasSelect.value;
    const tempat_lahir = tempatLahirInput.value.trim();
    const tanggal_lahir = tanggalLahirInput.value.trim();
    const alamat = alamatInput.value.trim();

    if(!id || !nama_siswa || !nisn || !kelas || !tempat_lahir || !tanggal_lahir){
      setFormMsg('Mohon lengkapi semua kolom wajib.', 'err');
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Menyimpan...';

    try{
      const payload = { nama_siswa, nisn, kelas, tempat_lahir, tanggal_lahir, alamat };
      let res;

      if(editingId){
        res = await fetch(`${SUPABASE_URL}/${TABLE}?id=eq.${encodeURIComponent(editingId)}`, {
          method: 'PATCH',
          headers: { ...headersBase, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
          body: JSON.stringify(payload)
        });
      } else {
        payload.id = id;
        res = await fetch(`${SUPABASE_URL}/${TABLE}`, {
          method: 'POST',
          headers: { ...headersBase, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
          body: JSON.stringify(payload)
        });
      }

      if(!res.ok){
        const errBody = await res.text();
        if(res.status === 409 || errBody.includes('duplicate')){
          throw new Error('ID siswa tersebut sudah digunakan, coba acak ulang ID.');
        }
        throw new Error(errBody || ('Status ' + res.status));
      }

      setFormMsg(editingId ? 'Perubahan berhasil disimpan.' : 'Data siswa baru berhasil ditambahkan.', 'ok');
      enterAddMode();
      await loadSiswa();
    }catch(err){
      console.error(err);
      setFormMsg('Gagal menyimpan: ' + err.message, 'err');
    }finally{
      btnSubmit.disabled = false;
      btnSubmit.textContent = editingId ? 'Simpan Perubahan' : 'Simpan';
    }
  });

  (async function init(){
    enterAddMode();
    await loadKelasOptions();
    await loadSiswa();
  })();
</script>
