<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi Pelajaran — SCORIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3B2E63;
    --ink-soft:#7A7191;
    --paper:#FFFAF0;
    --paper-deep:#FFEFD6;
    --paper-line:#F5DDAE;
    --brand:#6C4FE0;
    --gold:#FFC93C;
    --brick:#D6336C;
    --green:#1A8754;
    --turquoise:#0F766E;
    --purple:#7B5EEA;
    --amber:#92600F;
    --blue:#2F80ED;
    --orange:#F2994A;
    --footer-h:72px;
  }

  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--footer-h) + 20px);
    overflow-x:hidden;
    max-width:100vw;
  }
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- Navbar ---------- */
  .navbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--brand); color:#FFFFFF;
    padding:14px clamp(16px,4vw,40px);
  }
  .nav-left{display:flex; align-items:center; gap:10px;}
  .school-logo{
    width:38px; height:38px; border-radius:50%; background:var(--paper); color:var(--brand);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.75rem; flex-shrink:0; overflow:hidden;
  }
  .school-logo img{ width:100%; height:100%; object-fit:cover; }
  .nav-right{display:flex; align-items:center; gap:16px;}
  .nav-schoolinfo{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .school-name{ font-size:0.92rem; font-weight:500; color:var(--paper); max-width:32ch; }
  .term-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'JetBrains Mono',monospace; font-size:0.66rem; letter-spacing:0.02em;
    color:var(--gold); background:rgba(255,201,60,0.14);
    border:1px solid rgba(255,201,60,0.4); padding:2px 9px; border-radius:999px; white-space:nowrap;
  }
  .term-badge .dot{ width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .admin-account{ display:flex; align-items:center; gap:8px; padding-left:16px; border-left:1px solid rgba(240,234,217,0.25); }
  .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--gold); color:#221a06;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.78rem; flex-shrink:0;
  }
  .admin-name{font-size:0.88rem; color:#ddd6bf;}

  /* ---------- Main ---------- */
  main{ max-width:1100px; margin:0 auto; padding:32px clamp(16px,4vw,40px) 12px; }
  .page-heading-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .page-heading-row .page-heading{margin:0;}
  .page-heading{
    font-family:'Newsreader',serif; font-weight:500; font-size:clamp(1.4rem,2.6vw,1.85rem); margin:0 0 4px;
  }
  .page-sub{ font-size:0.92rem; color:var(--ink-soft); margin:0 0 24px; }
  .btn{
    font-family:inherit; font-size:0.82rem; font-weight:600; border-radius:6px; padding:0 16px;
    height:38px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
    border:1px solid transparent; white-space:nowrap; text-decoration:none;
  }
  .btn-ghost{background:#fbf8f0; color:var(--ink); border-color:var(--paper-line);}
  .btn-ghost:hover{border-color:var(--brick); color:var(--brick);}
  .btn-dashboard svg{width:14px; height:14px; vertical-align:-2px; margin-right:5px;}
  .section-heading{
    font-family:'Newsreader',serif; font-weight:500; font-size:1.1rem; margin:26px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-heading .count{
    font-family:'JetBrains Mono',monospace; font-size:0.68rem; font-weight:600;
    color:var(--ink-soft); background:var(--paper-deep); border:1px solid var(--paper-line);
    padding:2px 8px; border-radius:999px;
  }

  @media (max-width:560px){
    main{padding-left:5px; padding-right:5px;}
    .navbar{padding-left:5px; padding-right:5px;}
  }

  /* ---------- Stats ---------- */
  .stats-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px; margin-bottom:8px; min-width:0;
  }
  .stat-card{
    background:var(--stat-bg, var(--brand)); border-radius:10px; padding:16px 18px;
    color:#FFFFFF; box-shadow:0 6px 16px rgba(0,0,0,0.12);
  }
  .stat-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .stat-value{ font-family:'Newsreader',serif; font-weight:600; font-size:1.9rem; margin:0; line-height:1; }
  .stat-label{ font-size:0.8rem; margin:6px 0 0; color:rgba(255,255,255,0.9); }
  .stat-icon{
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .stat-icon svg{width:18px; height:18px; color:#FFFFFF;}

  /* ---------- Filter bar ---------- */
  .filter-bar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin:20px 0 4px; padding:14px; background:var(--paper-deep);
    border:1px solid var(--paper-line); border-radius:8px;
  }
  .filter-bar .field{ display:flex; flex-direction:column; gap:4px; }
  .filter-bar label{ font-size:0.68rem; font-weight:600; letter-spacing:0.02em; color:var(--ink-soft); text-transform:uppercase; }
  .filter-bar select, .filter-bar input[type="text"]{
    font-family:inherit; font-size:0.82rem; padding:7px 10px;
    border:1px solid var(--paper-line); border-radius:5px; background:#fbf8f0; color:var(--ink);
    min-width:170px;
  }
  .filter-bar select:focus, .filter-bar input:focus{ border-color:var(--brick); outline:none; }
  .filter-bar .field.grow{ flex:1; min-width:200px; }

  /* ---------- Materi cards ---------- */
  .materi-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
  }
  .materi-card{
    background:#fffdf7; border:1px solid var(--paper-line); border-left:4px solid var(--brand);
    border-radius:10px; padding:16px 18px; display:flex; flex-direction:column; gap:8px;
    box-shadow:0 3px 10px rgba(59,46,99,0.05);
  }
  .materi-card.jenis-video{ border-left-color:var(--brick); }
  .materi-card.jenis-tautan{ border-left-color:var(--blue); }
  .materi-card.jenis-teks{ border-left-color:var(--amber); }

  .materi-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .badge-jenis{
    display:inline-block; padding:3px 9px; border-radius:20px; font-size:0.7rem; font-weight:600;
    background:#EDE7FE; color:var(--brand); white-space:nowrap;
  }
  .badge-jenis.video{ background:#FDE7EE; color:var(--brick); }
  .badge-jenis.tautan{ background:#E6F0FF; color:var(--blue); }
  .badge-jenis.teks{ background:#FFF3DE; color:var(--amber); }
  .materi-tanggal{ font-size:0.7rem; color:var(--ink-soft); white-space:nowrap; }

  .materi-judul{
    font-family:'Newsreader',serif; font-weight:600; font-size:1.05rem; color:var(--ink); margin:0; line-height:1.3;
  }
  .materi-meta{ font-size:0.76rem; color:var(--ink-soft); }
  .materi-desk{ font-size:0.84rem; color:var(--ink); line-height:1.4; flex:1; }

  .materi-action{
    align-self:flex-start; margin-top:4px;
    font-family:inherit; font-size:0.8rem; font-weight:600; color:#FFFFFF;
    background:var(--brand); border:none; border-radius:6px; padding:8px 14px;
    cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    transition:background 0.15s ease;
  }
  .materi-action:hover{ background:#5A3FCC; }
  .materi-action svg{ width:14px; height:14px; }
  .materi-card.jenis-video .materi-action{ background:var(--brick); }
  .materi-card.jenis-video .materi-action:hover{ background:#B32559; }
  .materi-card.jenis-tautan .materi-action{ background:var(--blue); }
  .materi-card.jenis-tautan .materi-action:hover{ background:#1D62C4; }
  .materi-card.jenis-teks .materi-action{ background:var(--amber); }
  .materi-card.jenis-teks .materi-action:hover{ background:#734B0B; }

  .empty-state{
    text-align:center; color:var(--ink-soft); font-size:0.88rem;
    padding:32px 16px; background:#fffdf7; border:1px dashed var(--paper-line); border-radius:10px;
  }

  .badge-selesai{
    align-self:flex-start; display:inline-flex; align-items:center; gap:5px;
    font-size:0.7rem; font-weight:600; color:var(--green);
    background:#E7F5EE; border:1px solid #BFE3D0; padding:3px 9px; border-radius:20px;
  }
  .badge-selesai svg{ width:12px; height:12px; }

  .badge-belum{
    align-self:flex-start; display:inline-flex; align-items:center; gap:5px;
    font-size:0.7rem; font-weight:600; color:var(--ink-soft);
    background:var(--paper-deep); border:1px solid var(--paper-line); padding:3px 9px; border-radius:20px;
  }
  .badge-belum svg{ width:12px; height:12px; }

  /* ---------- Modal baca materi teks (tidak dipakai lagi) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(59,46,99,0.5);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px calc(40px + var(--footer-h));
    overflow-y:auto;
    opacity:0; visibility:hidden;
    transition:opacity 0.22s ease, visibility 0s linear 0.22s;
    z-index:50;
  }
  .modal-backdrop.open{ opacity:1; visibility:visible; transition:opacity 0.22s ease, visibility 0s linear 0s; }
  .modal-box{
    background:var(--paper); border-radius:14px; max-width:620px; width:100%;
    padding:24px clamp(18px,3vw,28px) 26px; box-shadow:0 20px 50px rgba(0,0,0,0.25);
    transform:translateY(-14px); transition:transform 0.22s ease;
  }
  .modal-backdrop.open .modal-box{ transform:translateY(0); }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:2px; }
  .modal-head h3{ font-family:'Newsreader',serif; font-weight:600; font-size:1.2rem; margin:0; line-height:1.3; }
  .modal-close{
    background:none; border:none; cursor:pointer; color:var(--ink-soft);
    width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0;
  }
  .modal-close:hover{ background:var(--paper-deep); color:var(--brick); }
  .modal-close svg{ width:18px; height:18px; }
  .modal-meta{ font-size:0.78rem; color:var(--ink-soft); margin:2px 0 16px; }
  .modal-body-text{
    font-size:0.9rem; line-height:1.65; color:var(--ink); white-space:pre-wrap;
    max-height:50vh; overflow-y:auto; padding-right:4px;
  }
  .modal-link-row{ margin-top:16px; }

  /* ---------- Footer sticky ---------- */
  .footer-bar{
    position:fixed; bottom:0; left:0; right:0; height:var(--footer-h);
    background:var(--turquoise); display:flex; align-items:stretch; justify-content:center;
    z-index:30; box-shadow:0 -4px 16px rgba(0,0,0,0.15);
  }
  .footer-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:none; border:none; color:var(--ink); font-size:0.75rem; font-weight:600;
    width:140px; cursor:pointer; transition:background 0.15s ease;
  }
  .footer-btn svg{width:20px; height:20px;}
  .footer-btn:hover{background:rgba(59,46,99,0.12); color:#FFFFFF;}
  .footer-btn.logout:hover{background:rgba(242,80,138,0.35); color:#FFFFFF;}

  @media (max-width:520px){
    .nav-schoolinfo{display:none;}
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <div class="school-logo" id="schoolLogo">SMA</div>
  </div>
  <div class="nav-right">
    <div class="nav-schoolinfo">
      <span class="school-name" id="schoolName">SMA Negeri 1 Contoh</span>
      <span class="term-badge" id="termBadge"><span class="dot"></span><span id="termBadgeText">Memuat...</span></span>
    </div>
    <div class="admin-account">
      <span class="avatar" id="siswaAvatar">SW</span>
      <span class="admin-name" id="siswaName">Siswa</span>
    </div>
  </div>
</header>

<main>
  <div class="page-heading-row">
    <div>
      <h1 class="page-heading">Materi Pelajaran</h1>
      <p class="page-sub" id="pageSub">Materi ajar dari guru untuk kelasmu. Pilih mata pelajaran atau cari judul materi di bawah ini.</p>
    </div>
    <a href="adminsiswa.html" class="btn btn-ghost btn-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Beranda
    </a>
  </div>

  <div class="stats-row">
    <div class="stat-card" style="--stat-bg:var(--brand);">
      <div class="stat-top">
        <div>
          <p class="stat-value" id="statTotalMateri">0</p>
          <p class="stat-label">Materi Tersedia</p>
        </div>
        <span class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2Z"/><path d="M8 7h8"/><path d="M8 11h5"/></svg>
        </span>
      </div>
    </div>
    <div class="stat-card" style="--stat-bg:var(--orange);">
      <div class="stat-top">
        <div>
          <p class="stat-value" id="statTotalMapel">0</p>
          <p class="stat-label">Mata Pelajaran</p>
        </div>
        <span class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M14 4v5h5"/></svg>
        </span>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="field">
      <label for="filterMapel">Mata Pelajaran</label>
      <select id="filterMapel">
        <option value="">Semua Mapel</option>
      </select>
    </div>
    <div class="field">
      <label for="filterJenis">Jenis Materi</label>
      <select id="filterJenis">
        <option value="">Semua Jenis</option>
        <option value="Dokumen">Dokumen</option>
        <option value="Video">Video</option>
        <option value="Tautan">Tautan</option>
        <option value="Teks Bacaan">Teks Bacaan</option>
      </select>
    </div>
    <div class="field grow">
      <label for="searchMateri">Cari Judul Materi</label>
      <input type="text" id="searchMateri" placeholder="Cari judul materi...">
    </div>
  </div>

  <div id="materiContainer">
    <p class="empty-state">Memuat materi ajar...</p>
  </div>
</main>

<!-- Footer sticky -->
<div class="footer-bar">
  <button class="footer-btn logout" id="logoutBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Log Out
  </button>
</div>

<script>
  const SUPABASE_URL = "https://obyeehxaencjphzejrmc.supabase.co/rest/v1";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ieWVlaHhhZW5janBoemVqcm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTY1MTEsImV4cCI6MjEwNTUzMjUxMX0.Dt-l_xY-nZw9eDtttwNXn0joMjE9O-hrFWvO2i-ogkw";
  const TABLE_MATERIAJAR = "materiajar";
  const TABLE_ABSENSI = "absensimapel";

  const sbHeaders = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY
  };

  // ---------- Auth guard: pastikan ada sesi siswa ----------
  function getSiswaSession(){
    try{
      const raw = localStorage.getItem('siswa_session');
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){
      return null;
    }
  }

  const siswaSession = getSiswaSession();
  if(!siswaSession){
    window.location.href = 'siswa.html';
  }

  function getInitials(nama){
    return nama
      .split(' ')
      .filter(Boolean)
      .slice(0, 2)
      .map(w => w[0].toUpperCase())
      .join('');
  }

  function escapeHtmlMateri(str){
    if(str === null || str === undefined) return '';
    return String(str)
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'",'&#39;');
  }

  (function renderSiswaAccount(){
    if(!siswaSession) return;
    const nama = siswaSession.nama_siswa || siswaSession.nama || 'Siswa';
    document.getElementById('siswaName').textContent = nama;
    document.getElementById('siswaAvatar').textContent = getInitials(nama) || 'SW';
  })();

  // ---------- Ambil logo & nama sekolah dari tabel "profil" ----------
  (async function loadSchoolProfile(){
    try{
      const res = await fetch(`${SUPABASE_URL}/profil?select=nama_sekolah,logo,semester,tahun_pelajaran&limit=1`, { headers: sbHeaders });
      if(!res.ok) return;
      const rows = await res.json();
      const profil = rows && rows[0];
      if(!profil) return;

      if(profil.nama_sekolah){
        document.getElementById('schoolName').textContent = profil.nama_sekolah;
      }

      const termBadgeText = document.getElementById('termBadgeText');
      if(termBadgeText){
        const semester = (profil.semester || '').trim();
        const tahunPelajaran = (profil.tahun_pelajaran || '').trim();
        if(semester || tahunPelajaran){
          termBadgeText.textContent = [semester ? 'Semester ' + semester : '', tahunPelajaran].filter(Boolean).join(' • ');
        } else {
          const termBadge = document.getElementById('termBadge');
          if(termBadge) termBadge.style.display = 'none';
        }
      }

      if(profil.logo){
        const logoEl = document.getElementById('schoolLogo');
        logoEl.innerHTML = '';
        const img = document.createElement('img');
        img.src = profil.logo;
        img.alt = 'Logo Sekolah';
        logoEl.appendChild(img);
      }
    }catch(err){
      console.error('Gagal memuat profil sekolah:', err);
    }
  })();

  // ================= Identitas siswa (nama, NISN, kelas) =================
  let siswaKelas = (siswaSession && siswaSession.kelas) ? String(siswaSession.kelas).trim() : '';
  let siswaNamaLengkap = (siswaSession && (siswaSession.nama_siswa || siswaSession.nama)) ? String(siswaSession.nama_siswa || siswaSession.nama).trim() : '';
  // Judul materi (huruf kecil, sudah di-trim) yang sudah tercatat pada tabel
  // "absensimapel" untuk siswa yang sedang login. Dipakai untuk menandai
  // status "Sudah dipelajari" / "Belum dipelajari" pada setiap card materi.
  let absensiJudulSet = new Set();

  async function loadSiswaKelas(){
    if(!siswaSession) return;
    try{
      let url;
      if(siswaSession.id){
        url = `${SUPABASE_URL}/datasiswa?id=eq.${encodeURIComponent(siswaSession.id)}&select=nama_siswa,nisn,kelas&limit=1`;
      } else {
        const nama = siswaSession.nama_siswa || siswaSession.nama || '';
        url = `${SUPABASE_URL}/datasiswa?nama_siswa=eq.${encodeURIComponent(nama)}&select=nama_siswa,nisn,kelas&limit=1`;
      }
      const res = await fetch(url, { headers: sbHeaders });
      if(res.ok){
        const rows = await res.json();
        const siswa = rows && rows[0];
        if(siswa && siswa.kelas){
          siswaKelas = String(siswa.kelas).trim();
        }
        if(siswa && siswa.nama_siswa){
          siswaNamaLengkap = String(siswa.nama_siswa).trim();
        }
      }
    }catch(err){
      console.error('Gagal memuat data kelas siswa:', err);
    }

    const pageSub = document.getElementById('pageSub');
    if(pageSub && siswaKelas){
      pageSub.textContent = `Materi ajar dari guru untuk kelas ${siswaKelas}. Pilih mata pelajaran atau cari judul materi di bawah ini.`;
    }

    await loadAbsensiProgress();
    loadMateriPelajaran();
  }

  // Ambil daftar judul materi yang sudah tercatat di tabel "absensimapel"
  // (dicatat siswa lewat halaman ruangmateri.html) untuk nama siswa ini.
  async function loadAbsensiProgress(){
    const nama = siswaNamaLengkap || (siswaSession && (siswaSession.nama_siswa || siswaSession.nama)) || '';
    if(!nama){
      absensiJudulSet = new Set();
      return;
    }
    try{
      const url = `${SUPABASE_URL}/${TABLE_ABSENSI}?nama_siswa=eq.${encodeURIComponent(nama)}&select=judul_materi`;
      const res = await fetch(url, { headers: sbHeaders });
      if(!res.ok) throw new Error('Status ' + res.status);
      const rows = await res.json();
      absensiJudulSet = new Set(
        (Array.isArray(rows) ? rows : [])
          .map(r => String(r.judul_materi || '').trim().toLowerCase())
          .filter(Boolean)
      );
    }catch(err){
      console.error('Gagal memuat status absensi mapel:', err);
      absensiJudulSet = new Set();
    }
  }

  // ================= Data & tampilan Materi Pelajaran =================
  // Sumber data: tabel "materiajar" (dibuat & dikelola guru di halaman
  // materiajarguru.html). Hanya materi berstatus "Aktif" yang ditarik,
  // lalu difilter lagi di sisi klien supaya kolom "kelas" milik guru
  // (yang bisa berisi beberapa kelas dipisah koma, mis. "X-1, X-2")
  // dicocokkan dengan kelas siswa yang sedang login.
  let allMateriRows = [];      // seluruh materi aktif dari Supabase
  let materiSiswaRows = [];    // sudah difilter sesuai kelas siswa
  let filterMapelValue = '';
  let filterJenisValue = '';
  let searchTermMateri = '';

  const materiContainerEl = document.getElementById('materiContainer');
  const filterMapelEl = document.getElementById('filterMapel');
  const filterJenisEl = document.getElementById('filterJenis');
  const searchMateriEl = document.getElementById('searchMateri');

  function kelasCocok(kelasMateri, kelasSiswa){
    if(!kelasSiswa) return false;
    const daftarKelasMateri = String(kelasMateri || '')
      .split(',')
      .map(k => k.trim().toLowerCase())
      .filter(Boolean);
    return daftarKelasMateri.includes(kelasSiswa.trim().toLowerCase());
  }

  function jenisClass(jenis){
    switch(jenis){
      case 'Video': return 'video';
      case 'Tautan': return 'tautan';
      case 'Teks Bacaan': return 'teks';
      default: return '';
    }
  }

  // Status "sudah dipelajari" kini dicek langsung ke tabel "absensimapel" di
  // Supabase (dicocokkan lewat nama siswa + judul materi), bukan lagi lewat
  // localStorage, supaya statusnya konsisten di perangkat manapun.
  function isMateriSelesai(row){
    const judul = String((row && row.judul_materi) || '').trim().toLowerCase();
    if(!judul) return false;
    return absensiJudulSet.has(judul);
  }

  function formatTanggalMateri(v){
    if(!v) return '-';
    try{
      return new Date(v).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
    }catch(e){
      return v;
    }
  }

  async function loadMateriPelajaran(){
    materiContainerEl.innerHTML = '<p class="empty-state">Memuat materi ajar...</p>';
    try{
      const url = `${SUPABASE_URL}/${TABLE_MATERIAJAR}?select=*&status=eq.Aktif&order=mata_pelajaran.asc,created_at.desc`;
      const res = await fetch(url, { headers: sbHeaders });
      if(!res.ok) throw new Error('Status ' + res.status);
      const rows = await res.json();

      allMateriRows = Array.isArray(rows) ? rows : [];
      materiSiswaRows = allMateriRows.filter(r => kelasCocok(r.kelas, siswaKelas));

      populateFilterMapel();
      renderStats();
      renderMateri();
    }catch(err){
      console.error('Gagal memuat materi pelajaran:', err);
      materiSiswaRows = [];
      materiContainerEl.innerHTML = `<p class="empty-state">Gagal memuat materi ajar. Pastikan tabel "${TABLE_MATERIAJAR}" sudah dibuat di Supabase.</p>`;
      renderStats();
    }
  }

  function populateFilterMapel(){
    const mapelList = Array.from(new Set(materiSiswaRows.map(r => r.mata_pelajaran).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'id'));
    filterMapelEl.innerHTML = '<option value="">Semua Mapel</option>' +
      mapelList.map(m => `<option value="${escapeHtmlMateri(m)}">${escapeHtmlMateri(m)}</option>`).join('');
  }

  function renderStats(){
    document.getElementById('statTotalMateri').textContent = String(materiSiswaRows.length);
    const mapelCount = new Set(materiSiswaRows.map(r => r.mata_pelajaran).filter(Boolean)).size;
    document.getElementById('statTotalMapel').textContent = String(mapelCount);
  }

  function getFilteredRows(){
    let rows = materiSiswaRows;
    if(filterMapelValue){
      rows = rows.filter(r => r.mata_pelajaran === filterMapelValue);
    }
    if(filterJenisValue){
      rows = rows.filter(r => r.jenis_materi === filterJenisValue);
    }
    const term = searchTermMateri.trim().toLowerCase();
    if(term){
      rows = rows.filter(r => String(r.judul_materi ?? '').toLowerCase().includes(term));
    }
    return rows;
  }

  function renderMateriCard(row){
    const jc = jenisClass(row.jenis_materi);
    const desk = row.deskripsi ? escapeHtmlMateri(row.deskripsi) : 'Tidak ada deskripsi tambahan untuk materi ini.';

    // Semua jenis materi kini dibuka di halaman khusus "ruangmateri.html"
    // supaya siswa belajar di dalam aplikasi, bukan sekadar melompat ke tautan.
    const actionHtml = `<a href="ruangmateri.html?id=${encodeURIComponent(row.id)}" class="materi-action">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2Z"/><path d="M8 7h8"/><path d="M8 11h5"/></svg>
      Pelajari Materi
    </a>`;

    const statusHtml = isMateriSelesai(row)
      ? `<span class="badge-selesai">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
          Sudah dipelajari
        </span>`
      : `<span class="badge-belum">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Belum dipelajari
        </span>`;

    return `<div class="materi-card jenis-${jc}">
      <div class="materi-top">
        <span class="badge-jenis ${jc}">${escapeHtmlMateri(row.jenis_materi || '-')}</span>
        <span class="materi-tanggal">${formatTanggalMateri(row.created_at)}</span>
      </div>
      <h4 class="materi-judul">${escapeHtmlMateri(row.judul_materi || '-')}</h4>
      <p class="materi-meta">${escapeHtmlMateri(row.mata_pelajaran || '-')} &middot; Kelas ${escapeHtmlMateri(row.kelas || '-')}</p>
      <p class="materi-desk">${desk}</p>
      ${statusHtml}
      ${actionHtml}
    </div>`;
  }

  function renderMateri(){
    if(!siswaKelas){
      materiContainerEl.innerHTML = '<p class="empty-state">Data kelas kamu belum ditemukan. Hubungi wali kelas atau admin sekolah.</p>';
      return;
    }

    const rows = getFilteredRows();
    if(rows.length === 0){
      materiContainerEl.innerHTML = '<p class="empty-state">Belum ada materi ajar yang tersedia untuk kelasmu saat ini.</p>';
      return;
    }

    if(filterMapelValue){
      materiContainerEl.innerHTML = `<div class="materi-grid">${rows.map(renderMateriCard).join('')}</div>`;
      return;
    }

    // Tanpa filter mapel: kelompokkan per mata pelajaran supaya rapi dibaca
    const grouped = new Map();
    rows.forEach(r => {
      const key = r.mata_pelajaran || 'Lainnya';
      if(!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(r);
    });

    const mapelKeys = Array.from(grouped.keys()).sort((a, b) => a.localeCompare(b, 'id'));
    materiContainerEl.innerHTML = mapelKeys.map(mapel => {
      const items = grouped.get(mapel);
      return `<h2 class="section-heading">${escapeHtmlMateri(mapel)} <span class="count">${items.length} materi</span></h2>
        <div class="materi-grid">${items.map(renderMateriCard).join('')}</div>`;
    }).join('');
  }

  filterMapelEl.addEventListener('change', (e) => {
    filterMapelValue = e.target.value;
    renderMateri();
  });
  filterJenisEl.addEventListener('change', (e) => {
    filterJenisValue = e.target.value;
    renderMateri();
  });
  let searchDebounceTimerMateri = null;
  searchMateriEl.addEventListener('input', (e) => {
    searchTermMateri = e.target.value;
    clearTimeout(searchDebounceTimerMateri);
    searchDebounceTimerMateri = setTimeout(renderMateri, 300);
  });

  // ---------- Log Out ----------
  function doLogout(){
    localStorage.removeItem('siswa_session');
    window.location.href = 'index.html';
  }
  document.getElementById('logoutBtn').addEventListener('click', doLogout);

  // ---------- Init ----------
  loadSiswaKelas();
</script>

</body>
</html>
